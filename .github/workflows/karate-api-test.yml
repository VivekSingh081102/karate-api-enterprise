name: Enterprise API Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      karate_env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging

jobs:
  api-tests:
    name: Execute Karate API Tests & Sync QMetry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Karate Test Suite
        env:
          ENV_NAME: ${{ github.event.inputs.karate_env || 'qa' }}
        run: |
          mvn clean test -Dkarate.env="$ENV_NAME"

      - name: Upload Karate HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-execution-report
          path: target/karate-reports/
          retention-days: 7

      - name: Publish Test Report to GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Import Execution Results into QMetry (SCRUM-TR-1)
        if: always()
        env:
          QMETRY_API_KEY: ${{ secrets.QMETRY_API_KEY }}
          ENV_NAME: ${{ github.event.inputs.karate_env || 'qa' }}
        run: |
          zip -j cucumber-results.zip target/karate-reports/*.json

          RESPONSE=$(curl -sS --connect-timeout 15 --max-time 60 \
            -X POST "https://qtmcloud.qmetry.com/rest/api/latest/importresults" \
            -H "Content-Type: application/json" \
            -H "apiKey: $QMETRY_API_KEY" \
            -d '{
              "format": "cucumber",
              "isZip": true,
              "testCycleToReuse": "SCRUM-TR-1",
              "environment": "'"$ENV_NAME"'",
              "matchTestSteps": true
            }')

          echo "QMetry Init Response: $RESPONSE"
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.url')

          if [ "$UPLOAD_URL" = "null" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Failed to obtain QMetry upload URL. Check API key or endpoint."
            exit 1
          fi

          HTTP_STATUS=$(curl -sS --connect-timeout 15 --max-time 60 \
            -o /dev/null -w "%{http_code}" -X PUT "$UPLOAD_URL" \
            -H "Content-Type: multipart/form-data" \
            --upload-file cucumber-results.zip)

          echo "S3 Upload HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "File upload to QMetry storage failed."
            exit 1
          fi

          echo "Results uploaded to QMetry successfully."