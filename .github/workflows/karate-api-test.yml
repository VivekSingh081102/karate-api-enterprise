name: API Regression Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      karate_env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging

jobs:
  api-tests:
    name: Execute Karate API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Project Structure in CI
        run: |
          echo "Listing test resources:"
          find src/test -type f

      - name: Run Karate Test Suite
        env:
          ENV_NAME: ${{ github.event.inputs.karate_env || 'qa' }}
        run: |
          mvn clean test -Dkarate.env="$ENV_NAME"

      - name: Upload Karate HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-execution-report
          path: target/karate-reports/
          retention-days: 7

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit